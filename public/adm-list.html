<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Painel ADM - Lista de Artigos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

    <!-- BOOTSTRAP + ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- SEU SIDEBAR.CSS (mantido) -->
    <link href="/assets/css/sidebar.css" rel="stylesheet">

    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Roboto', sans-serif;
        }

        .controls {
            gap: 12px;
            margin-bottom: 20px;
        }

        .small-muted {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .table th {
            font-weight: 600;
            color: #2c3e50;
        }

        .btn-edit i {
            color: #0d6efd;
        }

        .btn-delete i {
            color: #dc3545;
        }

        /* Garante que o container respeite a sidebar */
        @media (min-width: 993px) {
            .container {
                margin-left: 260px !important;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar injetada pelo seu JS -->
    <div id="sidebar"></div>

    <div class="container">
        <!-- TÍTULO PADRÃO DO PAINEL (igual ao de publicar) -->
        <h1 class="mb-4 text-primary">
            Lista de Artigos
        </h1>

        <!-- Cabeçalho com total -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h5 class="mb-0 text-secondary">Artigos Publicados</h5>
            <div class="text-muted">
                <strong>Total:</strong> <span id="total-count" class="text-primary fw-bold">0</span>
            </div>
        </div>

        <!-- Controles de filtro e busca -->
        <div class="row controls">
            <div class="col-lg-5 col-md-6">
                <input id="search-input" class="form-control" placeholder="Pesquisar por título...">
            </div>
            <div class="col-lg-4 col-md-6">
                <select id="category-filter" class="form-select">
                    <option value="">Todas as categorias</option>
                </select>
            </div>
        </div>

        <!-- Tabela -->
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Título</th>
                        <th>Slug</th>
                        <th>Categorias</th>
                        <th>Data</th>
                        <th class="text-center" style="width:170px">Ações</th>
                    </tr>
                </thead>
                <tbody id="articles-table-body">
                    <tr>
                        <td colspan="5" class="text-center text-muted py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Paginação e itens por página -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 gap-3">
            <div class="small-muted">
                Itens por página:
                <select id="per-page" class="form-select d-inline-block" style="width:110px;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                </select>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div>
                    <button id="prev-page" class="btn btn-outline-secondary btn-sm">Anterior</button>
                    <button id="next-page" class="btn btn-outline-secondary btn-sm">Próxima</button>
                </div>
                <div class="small-muted" id="page-info">Página 1 de 1</div>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 (global) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts na ordem correta -->
    <script src="/assets/js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/painel-adm-list.js"></script>
</body>

</html>
